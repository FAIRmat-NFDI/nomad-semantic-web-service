version = 1

exclude = [
  ".worktrees/**",
  ".venv/**",
]

# Ontology file can't practically carry an inline header. 
[[annotations]]
path = ["src/nomad_semantic_web_service/ontologies/*.owl"]
SPDX-FileCopyrightText = "The nomad-semantic-web-service Authors"
SPDX-License-Identifier = "Apache-2.0"

# Non-code project files (docs, CI, tooling config) that can't practically
# carry an inline header.
[[annotations]]
path = ["docs/**"]
SPDX-FileCopyrightText = "The nomad-semantic-web-service Authors"
SPDX-License-Identifier = "Apache-2.0"

[[annotations]]
path = [
  ".cruft.json",
  ".cspell/custom-dictionary.txt",
  ".devcontainer/**",
  ".github/**",
  ".gitignore",
  ".gitmodules",
  ".pre-commit-config.yaml",
  ".vscode/settings.json",
  "CITATION.cff",
  "MANIFEST.in",
  "README.md",
  "cspell.json",
  "mkdocs.yml",
  "pyproject.toml",
]
SPDX-FileCopyrightText = "The nomad-semantic-web-service Authors"
SPDX-License-Identifier = "Apache-2.0"

# Example and test fixtures/readmes: data files, not source, so no inline header.
[[annotations]]
path = [
  "tests/data/**",
]
SPDX-FileCopyrightText = "The nomad-semantic-web-service Authors"
SPDX-License-Identifier = "Apache-2.0"