version = 1

exclude = [
  ".worktrees/**",
  ".venv/**",
]

# Ontology file can't practically carry an inline header. 
[[annotations]]
path = ["src/nomad_semantic_web_service/ontologies/*.owl"]
SPDX-FileCopyrightText = "The nomad-semantic-web-service Authors"
SPDX-License-Identifier = "Apache-2.0"

# Non-code project files (docs, CI, tooling config) that can't practically
# carry an inline header.
[[annotations]]
path = ["docs/**"]
SPDX-FileCopyrightText = "The nomad-semantic-web-service Authors"
SPDX-License-Identifier = "Apache-2.0"

[[annotations]]
path = [
  ".cruft.json",
  ".cspell/custom-dictionary.txt",
  ".devcontainer/**",
  ".github/**",
  ".gitignore",
  ".gitmodules",
  ".pre-commit-config.yaml",
  ".vscode/settings.json",
  "CITATION.cff",
  "MANIFEST.in",
  "README.md",
  "cspell.json",
  "mkdocs.yml",
  "pyproject.toml",
]
SPDX-FileCopyrightText = "The nomad-semantic-web-service Authors"
SPDX-License-Identifier = "Apache-2.0"

# Example and test fixtures/readmes: data files, not source, so no inline header.
[[annotations]]
path = [
  "tests/data/**",
]
SPDX-FileCopyrightText = "The nomad-semantic-web-service Authors"
SPDX-License-Identifier = "Apache-2.0"

# OSCARS XAS demonstrator example upload: notebooks, README, and upload
# metadata can't carry an inline header. The two .py helper scripts in this
# folder do and are not listed here.
[[annotations]]
path = [
  "src/nomad_semantic_web_service/example_uploads/oscars_xas_demo/*.ipynb",
  "src/nomad_semantic_web_service/example_uploads/oscars_xas_demo/README.md",
  "src/nomad_semantic_web_service/example_uploads/oscars_xas_demo/nomad.json",
]
SPDX-FileCopyrightText = "The nomad-semantic-web-service Authors"
SPDX-License-Identifier = "Apache-2.0"